name: Frontend Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build Frontend"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Build
        run: npm run build
